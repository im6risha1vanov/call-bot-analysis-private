<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AveronCRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — fixed sidebar of modules, top bar with client and balance, content pane; drawer slides in for a contact card */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --surface-2:#eef1ee; --line:#dde3de; --fg:#13201c; --muted:#5d6b66;
  --accent:#0d7a63; --accent-ink:#ffffff; --accent-soft:#d9efe8;
  --heat:#d9761a; --heat-soft:#fbead8;
  --s-search:#0d7a63; --s-site:#3f63c4; --s-call:#c2543a;
  --good:#1f8a4c; --warn:#b7791f; --bad:#c0392b;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#151e1b; --surface-2:#1b2622; --line:#2a3732; --fg:#e6eeea; --muted:#93a39d;
  --accent:#3cc2a0; --accent-ink:#06261e; --accent-soft:#163a31;
  --heat:#f0a050; --heat-soft:#3a2a18;
  --s-search:#3cc2a0; --s-site:#7f9cf0; --s-call:#ec8a70;
  --good:#4cc782; --warn:#e2b04f; --bad:#ef7565; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#151e1b; --surface-2:#1b2622; --line:#2a3732; --fg:#e6eeea; --muted:#93a39d;
  --accent:#3cc2a0; --accent-ink:#06261e; --accent-soft:#163a31;
  --heat:#f0a050; --heat-soft:#3a2a18;
  --s-search:#3cc2a0; --s-site:#7f9cf0; --s-call:#ec8a70;
  --good:#4cc782; --warn:#e2b04f; --bad:#ef7565; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.logo{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;padding:0 8px}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center}
.logo i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-ink) 35%,transparent)}
.logo b{color:var(--accent)}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;text-align:left;width:100%;color:var(--fg)}
.nav:hover{background:var(--surface-2)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .soon{margin-left:auto;font-size:10.5px;padding:2px 6px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:500}
.nav .count{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--heat);color:#fff;font-weight:600}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line)}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.client{display:flex;flex-direction:column}
.client b{font-weight:600}
.client span{font-size:12px;color:var(--muted)}
.top .spacer{flex:1}
.demo{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--heat-soft);color:var(--heat);font-weight:600}
.balance{display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--line);border-radius:8px}
.balance small{color:var(--muted);font-size:11.5px;display:block}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:22px;max-width:1240px;width:100%}
h1{font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:-.015em;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:4px 0 0;max-width:68ch}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head .spacer{flex:1}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi small{color:var(--muted);font-size:12.5px;display:block}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.kpi .d{font-size:12px;margin-top:2px;color:var(--good)}
.kpi .d.down{color:var(--bad)}
.kpi.hot{border-color:var(--heat);background:linear-gradient(var(--heat-soft),var(--heat-soft))}
.kpi.hot .v{color:var(--heat)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:15px;font-weight:600;margin:0 0 4px}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart svg{width:100%;height:auto;display:block}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap;font-weight:500}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.src-search{color:var(--s-search);background:color-mix(in srgb,var(--s-search) 12%,transparent)}
.src-site{color:var(--s-site);background:color-mix(in srgb,var(--s-site) 12%,transparent)}
.src-call{color:var(--s-call);background:color-mix(in srgb,var(--s-call) 12%,transparent)}
.st{font-size:12px;padding:3px 9px;border-radius:6px;font-weight:600;white-space:nowrap}
.st-new{background:var(--heat-soft);color:var(--heat)}
.st-work{background:color-mix(in srgb,var(--s-site) 14%,transparent);color:var(--s-site)}
.st-hot{background:var(--accent-soft);color:var(--accent)}
.st-no{background:var(--surface-2);color:var(--muted)}
/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td .what{font-weight:500}
td .meta{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px}
.fbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* feed */
.feed{display:flex;flex-direction:column}
.feed .row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.feed .row:last-child{border-bottom:0}
.feed .row .t{font-size:12px;color:var(--muted);width:44px;flex:none;padding-top:2px}
.feed .row .b{min-width:0;flex:1}
.feed .row .b p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
/* campaigns */
.camps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.camp{display:flex;flex-direction:column;gap:12px}
.camp .ttl{display:flex;align-items:center;gap:10px}
.camp .ttl b{font-size:15px}
.camp .ttl .spacer{flex:1}
.on{font-size:12px;font-weight:600;color:var(--good)}
.off{font-size:12px;font-weight:600;color:var(--muted)}
.funnel{display:flex;flex-direction:column;gap:6px}
.frow{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:12.5px}
.frow .bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.frow .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.frow:last-child .bar i{background:var(--heat)}
.frow .n{text-align:right}
.call{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.call:last-child{border-bottom:0}
.call .ai{grid-column:1/-1;font-size:12.5px;background:var(--surface-2);border-radius:8px;padding:8px 10px;color:var(--fg)}
.call .ai b{color:var(--accent);font-weight:600}
/* pixel */
.code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre;color:var(--fg)}
.steps{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}
.ok{color:var(--good);font-weight:600}
/* segments */
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 6px 5px 10px;font-size:13px;background:var(--surface)}
.tag button{border:0;background:none;color:var(--muted);padding:0 4px;font-size:15px;line-height:1}
.addrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addrow input,.field input{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit;min-width:0;flex:1}
.seggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--accent)}
/* soon */
.soonbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.soonbox ul{margin:12px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.mock{border:1px dashed var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.mock .l{height:10px;border-radius:5px;background:var(--line)}
/* drawer */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 35%,transparent);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none}
.drawer header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer header .x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
.drawer .body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.timeline div{position:relative;padding:0 0 14px 16px;font-size:13px}
.timeline div::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline small{display:block;color:var(--muted);font-size:12px}
.drawer footer{margin-top:auto;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:all .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(188px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:220px;transition:outline-color .15s;outline:2px dashed transparent;outline-offset:-2px}
.col.over{outline-color:var(--accent)}
.colhead{display:flex;align-items:baseline;gap:8px;padding:2px 4px 6px}
.colhead b{font-size:13px}
.colhead .n{font-size:12px;color:var(--muted)}
.colhead .sum{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.card:active{cursor:grabbing}
.card .r{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.card .r .spacer{flex:1}
.card .nx{font-size:12px;color:var(--muted)}
.card .nx.late{color:var(--bad);font-weight:500}
.ava{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none}
.mv{white-space:nowrap;flex:none;border:1px solid var(--line);background:none;border-radius:6px;font-size:12px;padding:2px 8px;color:var(--muted)}
/* reviews */
.mgrs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mgr{display:flex;flex-direction:column;gap:6px}
.mgr .top2{display:flex;align-items:center;gap:10px}
.mgr .pct{font-family:var(--mono);font-size:22px;font-weight:600}
.mgr .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.mgr .bar i{display:block;height:100%;background:var(--accent)}
.mgr .err{font-size:12.5px;color:var(--muted)}
.mgr .err b{color:var(--fg);font-weight:500}
.rv{border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.rv>button{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 4px}
.rv>button:hover{background:var(--surface-2)}
.rv .detail{padding:0 4px 16px 68px;display:flex;flex-direction:column;gap:10px}
.five{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.quote{border-left:3px solid var(--heat);padding:6px 12px;background:var(--heat-soft);border-radius:0 8px 8px 0;font-size:13px}
.quote .tc{font-family:var(--mono);font-size:12px;color:var(--heat);margin-right:6px}
.better{border-left:3px solid var(--accent);padding:6px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:13px}
.res-meet{background:var(--accent-soft);color:var(--accent)}
.res-cb{background:color-mix(in srgb,var(--s-site) 14%,transparent);color:var(--s-site)}
.res-kp{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.res-lost{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
/* trainer */
.scen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.scen .panel{display:flex;flex-direction:column;gap:8px}
.scen .why{font-size:12.5px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:8px;max-width:620px}
.msg{padding:9px 12px;border-radius:12px;font-size:13.5px;max-width:85%}
.msg.c{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px}
.msg.m{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg.f{align-self:stretch;max-width:none;background:var(--heat-soft);border-radius:8px;font-size:13px}
.prog{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;padding:6px 0}
.prog .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent)}
/* pricing */
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.plan{display:flex;flex-direction:column;gap:10px;position:relative}
.plan.cur{border:2px solid var(--accent)}
.plan .badge{position:absolute;top:-11px;left:16px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:999px}
.plan .price{font-family:var(--mono);font-size:26px;font-weight:600}
.plan .price small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.plan .btn{margin-top:auto}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.pkgbar{display:flex;align-items:center;gap:16px}
.pkgbar small{display:block;color:var(--muted);font-size:12px}
.pkgbar b{font-size:22px;font-weight:600}
.pkgbar .pk-r{text-align:right}
.pkgbar .track{flex:1;height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.pkgbar .track i{display:block;height:100%;background:var(--accent);border-radius:7px}
.sblock{background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.sblock p{margin:4px 0 0;font-size:13px}
.feed .row.click{cursor:pointer;align-items:center}
.feed .row.click:hover{background:var(--surface-2)}
.plans{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))!important}
.mobnav{display:none}
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.camps,.seggrid,.soonbox,.scen,.plans{grid-template-columns:minmax(0,1fr)}
  .mgrs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rv .detail{padding-left:4px}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobnav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
  .mobnav .nav{width:auto;white-space:nowrap;padding:7px 12px}
  .top{padding:12px 16px}
  .content{padding:18px 16px 40px}
  .balance{display:none}
  .top .demo{order:3}
  #topup{padding:6px 12px;font-size:13px}
  h1{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* working version additions */
.main{min-width:0}
.me{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.me select{max-width:160px}
.empty{max-width:560px;margin:40px auto;text-align:center}
.mut{color:var(--muted)}
.nowrap{white-space:nowrap}
.src-other{background:var(--surface-2);color:var(--muted)}
.st-bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.steps3 .panel{display:flex;flex-direction:column;gap:10px}
.steps3 h2{margin:0}

function normPhone(raw){let d=String(raw).replace(/\D/g,'');if(d.length===10)d='7'+d;if(d.length===11&&d[0]==='8')d='7'+d.slice(1);if(d.length!==11||d[0]!=='7')return null;return '+7 '+d.slice(1,4)+' '+d.slice(4,7)+'-'+d.slice(7,9)+'-'+d.slice(9,11)}

function allNumbers(){const out=[];for(const b of S.batches){const it=b.items||{};for(const k in it){const n=it[k];if(n&&n.phone)out.push({...n,bid:b.id,nid:k,ref:b.id+'/'+k})}}out.sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));return out}

function stats(){
  const nums=allNumbers(),p=pkg();
  const inPkg=p.start?nums.filter(n=>(n.ts||'').slice(0,10)>=p.start):nums;
  const c=st=>inPkg.filter(n=>n.status===st).length;

  const deals=S.deals.filter(d=>d.stage!=='lost'),paid=S.deals.filter(d=>d.stage==='paid');

async function guard(fn,okMsg){
  if(S.readonly){toast('У вас доступ только на просмотр');return false}
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){const c=e&&e.code;
    if(c==='invalid_argument'){S.readonly=true;toast('Не удалось сохранить: у вас нет прав на изменение');render()}
    else if(c==='quota_exceeded')toast('База заполнена. Удалите старые номера или сделки');
    else if(c==='resource_exhausted')toast('Слишком много действий подряд, повторите через минуту');
    else toast('Не удалось сохранить, попробуйте ещё раз');
    return false}
}
const updNumber=(n,patch,msg)=>guard(()=>db.doc('batches/'+n.bid).update({items:{[n.nid]:{...patch,updatedAt:new Date().toISOString()}}}),msg);

async function importNumbers(text,kind,from){
  const existing=new Set(allNumbers().map(n=>n.phone));
  const lines=String(text).split(/\r?\n/);const fresh=[];let dup=0,badc=0;
  for(const line of lines){if(!line.trim())continue;
    const m=line.match(/\+?\d[\d\s\-()]{8,16}\d/);const ph=m&&normPhone(m[0]);
    if(!ph){badc++;continue}
    if(existing.has(ph)){dup++;continue}existing.add(ph);
    const rest=line.replace(m[0],'');const dom=rest.match(/[a-z0-9][a-z0-9.-]*\.[a-zа-я]{2,}/i);
    const cp=!dom&&rest.match(/\+?\d[\d\s\-()]{8,16}\d/);const cph=cp&&normPhone(cp[0]);
    const k=dom?'site':cph?'call':kind;const f=dom?dom[0].toLowerCase():cph?(cph+' '+rest.replace(cp[0],'').replace(/^[\s;,\t]+|[\s;,\t]+$/g,'')).trim():from;
    fresh.push({phone:ph,src:k,from:f||'',status:'new',owner:'',note:'',ts:new Date().toISOString()});
  }
  if(!fresh.length){toast(`Новых номеров нет. Дублей: ${dup}, не распознано: ${badc}`);return false}
  const d=today();let k=0,i=0;
  const sizeOf=id=>{const b=S.batches.find(x=>x.id===id);return b?Object.keys(b.items||{}).length:0};
  const ok=await guard(async()=>{
    while(i<fresh.length){
      let id='d'+d+'-'+k;while(sizeOf(id)>=ITEMS_PER_BATCH){k++;id='d'+d+'-'+k}
      const room=ITEMS_PER_BATCH-sizeOf(id);const chunk=fresh.slice(i,i+room);const items={};
      chunk.forEach(n=>items[newId()]=n);
      const ex=S.batches.find(x=>x.id===id);
      if(ex)await db.doc('batches/'+id).update({items});else await db.doc('batches/'+id).set({date:d,createdAt:new Date().toISOString(),items});
      i+=chunk.length;k++;
    }
  });
  if(ok){toast(`Загружено ${fresh.length} номеров`+(dup?`, дублей пропущено: ${dup}`:'')+(badc?`, не распознано: ${badc}`:''));
    const known=new Set(S.sources.map(s=>s.kind+'|'+s.value));
    for(const n of fresh){const key=n.src+'|'+n.from;if(n.from&&!known.has(key)){known.add(key);await guard(()=>db.collection('sources').add({kind:n.src,value:n.from,createdAt:new Date().toISOString()}))}}
  }
  return ok;
}

function keepEdits(el,paint){const kept={};el.querySelectorAll('input[id],textarea[id],select[id]').forEach(f=>{if(f.type==='checkbox'||f.type==='file')return;const def=f.tagName==='SELECT'?Math.max(0,[...f.options].findIndex(o=>o.defaultSelected)):0;const changed=f.tagName==='SELECT'?f.selectedIndex!==def:f.value!==f.defaultValue;if(changed)kept[f.id]=f.value});paint();for(const id in kept){const f=el.querySelector('#'+CSS.escape(id));if(f)f.value=kept[id]}}

function sourceStats(nums){
  const map=new Map();
  for(const s of S.sources){map.set(s.kind+'|'+s.value,{kind:s.kind,value:s.value,docId:s.id,n:0,proc:0,l:0})}
  for(const n of nums){const key=(n.src||'other')+'|'+(n.from||'');let r=map.get(key);if(!r){r={kind:n.src||'other',value:n.from||'',n:0,proc:0,l:0};map.set(key,r)}r.n++;if(n.status&&n.status!=='new')r.proc++;if(n.status==='lead')r.l++}
  return [...map.values()].map(r=>({...r,p:r.proc>=10?Math.round(r.l/r.proc*1000)/10:null})).sort((a,b)=>b.n-a.n);
}

/* ---------- drawer ---------- */
function renderDrawer(){
  const d=$('#drawer');
  if(!openRef){d.classList.remove('open');d.setAttribute('aria-hidden','true');$('#scrim').classList.remove('open');return}
  const a=document.activeElement;if(a&&d.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  let html='';
  if(openRef.type==='num'){const n=allNumbers().find(x=>x.ref===openRef.id);if(!n){openRef=null;return renderDrawer()}
    const deal=n.deal&&S.deals.find(x=>x.id===n.deal);
    html=`<header><div><div style="margin-bottom:6px">${chip(n.src)}</div><h2 class="num" style="margin:0;font-size:19px">${esc(n.phone)}</h2><div class="mut" style="font-size:12.5px;margin-top:4px">${dt(n.ts)} · ${esc(n.from||'источник не указан')}</div></div><button class="x" id="close" aria-label="Закрыть">×</button></header>
    <div class="body">
      <div class="copyrow"><span class="num">${esc(n.phone)}</span><span class="spacer"></span><a class="btn sm primary" href="tel:${esc(n.phone.replace(/[^+\d]/g,''))}">Позвонить</a><button class="btn sm" data-copy="${esc(n.phone)}">Скопировать</button></div>
      <label class="fl">Статус<div class="stbtns">${Object.keys(ST).map(k=>`<button class="stb ${n.status===k?'on':''}" data-setst="${k}">${ST[k][0]}</button>`).join('')}</div></label>
      <label class="fl">Обрабатывает<select id="d-owner"><option value="">никто</option>${managers().map(m=>`<option value="${esc(m.id)}" ${n.owner===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}<option value="kc" ${n.owner==='kc'?'selected':''}>Колл-центр Averon</option></select></label>
      <label class="fl">Заметка<textarea id="d-note" rows="4" placeholder="Что сказал клиент, когда перезвонить">${esc(n.note||'')}</textarea></label>
      <div class="addrow" style="margin-top:0"><button class="btn sm" id="d-savenote">Сохранить заметку</button></div>
      ${deal?`<div class="sblock"><b>Сделка</b><p>${esc(deal.title)} · ${STAGES.find(s=>s.id===deal.stage)?.n||''} · ${fmt(deal.sum)} ₽</p><button class="btn sm" data-opendeal="${esc(deal.id)}">Открыть сделку</button></div>`:''}
      ${n.updatedAt?`<p class="sub">Изменён ${dt(n.updatedAt)}</p>`:''}
    </div>
    <footer>${n.owner?'':`<button class="btn primary" data-take="1">Взять себе</button><button class="btn" data-tokc="1">Передать в КЦ</button>`}${!deal?`<button class="btn ${n.owner?'primary':''}" data-mkdeal="1">Создать сделку</button>`:''}</footer>`;
  }else if(openRef.type==='deal'){const isNew=openRef.id==='new';const dl=isNew?{title:'',phone:'',sum:'',stage:'new',owner:me(),next:'',nextDate:''}:S.deals.find(x=>x.id===openRef.id);if(!dl){openRef=null;return renderDrawer()}
    html=`<header><div><h2 style="margin:0;font-size:17px">${isNew?'Новая сделка':esc(dl.title||'Сделка')}</h2>${dl.createdAt?`<div class="mut" style="font-size:12.5px;margin-top:4px">создана ${dt(dl.createdAt)}</div>`:''}</div><button class="x" id="close" aria-label="Закрыть">×</button></header>
    <form class="body" data-deal-form="${esc(openRef.id)}">
      <label class="fl">Название<input id="dl-title" value="${esc(dl.title)}" placeholder="Например, угловая кухня, Химки" required></label>
      <label class="fl">Телефон<input id="dl-phone" value="${esc(dl.phone)}" placeholder="+7 900 000-00-00"></label>
      <div class="fgrid2"><label class="fl">Сумма, ₽<input id="dl-sum" type="number" min="0" step="any" value="${esc(dl.sum)}"></label>
      <label class="fl">Этап<select id="dl-stage">${STAGES.map(s=>`<option value="${s.id}" ${dl.stage===s.id?'selected':''}>${s.n}</option>`).join('')}</select></label></div>
      <label class="fl">Ответственный<select id="dl-owner"><option value="">никто</option>${managers().map(m=>`<option value="${esc(m.id)}" ${dl.owner===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
      <div class="fgrid2"><label class="fl">Следующий шаг<input id="dl-next" value="${esc(dl.next)}" placeholder="Замер, звонок, КП"></label>
      <label class="fl">Когда<input id="dl-date" type="date" value="${esc(dl.nextDate)}"></label></div>
      <div class="addrow"><button class="btn primary">${isNew?'Создать':'Сохранить'}</button>${isNew?'':`<button type="button" class="btn" data-deldeal="${esc(dl.id)}">Удалить</button>`}</div>
    </form>`;
  }else if(openRef.type==='call'){html=renderCallDrawer();if(!html){openRef=null;return renderDrawer()}
  }else if(openRef.type==='client'){html=renderClientDrawer();if(!html){openRef=null;return renderDrawer()}
  }else if(openRef.type==='import'){
    html=`<header><div><h2 style="margin:0;font-size:17px">Загрузить номера</h2><div class="mut" style="font-size:12.5px;margin-top:4px">Из выгрузки Averon, Excel или CSV</div></div><button class="x" id="close" aria-label="Закрыть">×</button></header>
    <form class="body" data-import-form="1">
      <p class="sub" style="margin:0">По одному номеру в строке. Если в строке есть сайт конкурента, он станет источником сам. Повторы и уже загруженные номера пропускаются.</p>
      <label class="fl">Номера<textarea id="im-text" rows="9" placeholder="+7 916 384-42-18;kuhni.ru&#10;89036120755&#10;9252709130"></textarea></label>

      <div class="fgrid2"><label class="fl">Источник по умолчанию<select id="im-kind"><option value="site">Сайт конкурента</option><option value="call">Звонок конкуренту</option><option value="other">Другое</option></select></label>
      <label class="fl">Какой именно<input id="im-from" placeholder="kuhni.ru или +7 495 …" list="srclist"></label></div>
      <datalist id="srclist">${S.sources.map(s=>`<option value="${esc(s.value)}">`).join('')}</datalist>
      <div class="addrow"><button class="btn primary" id="im-go">Загрузить</button></div>
    </form>`;
  }
  const key=openRef.type+':'+openRef.id;if(d.dataset.ref===key)keepEdits(d,()=>{d.innerHTML=html});else d.innerHTML=html;d.dataset.ref=key;d.classList.add('open');d.setAttribute('aria-hidden','false');$('#scrim').classList.add('open');
}
function openDrawer(type,id){openRef={type,id};renderDrawer();setTimeout(()=>{const f=$('#drawer input:not([type=checkbox]),#drawer textarea,#close');f&&f.focus()},60)}
function closeDrawer(){openRef=null;renderDrawer();if(pendingRender)render()}

/* ---------- names in chat ---------- */
async function paintNames(){if(!user||current!=='chat')return;const els=[...document.querySelectorAll('.mh[data-author]')];const ids=[...new Set(els.map(e=>e.dataset.author).filter(Boolean))];if(!ids.length)return;const ps=await user.profiles(ids);els.forEach(e=>{const p=ps[e.dataset.author];if(p&&!e.dataset.named){e.dataset.named='1';e.prepend(document.createTextNode((p.isMe?'Вы':(p.name||'Участник'))+' · '))}})}

/* ---------- events ---------- */
function go(id){if(!VIEWS[id])return;current=id;selected.clear();render();window.scrollTo(0,0);if(id==='chat'){paintNames();const b=$('#chatbox');b&&(b.scrollTop=b.scrollHeight)}}
document.addEventListener('click',async e=>{
  if(e.target.closest('a[href]'))return;
  const t=e.target.closest('button,[data-num],[data-deal],[data-sel],[data-call],[data-mgr],#scrim');if(!t)return;const ds=t.dataset;
  if(t.id==='scrim'||t.id==='close')return closeDrawer();
  if(ds.go)return go(ds.go);
  if(ds.tf){const [k,v]=ds.tf.split(':');(ds.obj==='team'?teamF:callF)[k]=v;return render()}
  if(ds.mgr){callF={m:ds.mgr,r:'all',ty:'all',q:''};return go('calls')}
  if(ds.call&&!e.target.closest('a'))return openDrawer('call',ds.call);
  if(ds.import)return openDrawer('import','');
  if(ds.f){const [k,v]=ds.f.split(':');numFilter[k]=v;return render()}
  if(ds.sel!==undefined&&t.tagName==='INPUT'){e.stopPropagation();t.checked?selected.add(ds.sel):selected.delete(ds.sel);return render()}
  if(t.id==='selall')return;
  if(ds.num&&!e.target.closest('input'))return openDrawer('num',ds.num);
  if(ds.deal&&!e.target.closest('button'))return openDrawer('deal',ds.deal);
  if(ds.opendeal)return openDrawer('deal',ds.opendeal);
  if(ds.copy){try{await navigator.clipboard.writeText(ds.copy);toast('Номер скопирован')}catch(err){toast('Скопируйте номер вручную')}return}
  const n=openRef&&openRef.type==='num'?allNumbers().find(x=>x.ref===openRef.id):null;
  if(ds.setst&&n)return updNumber(n,{status:ds.setst},'Статус: '+ST[ds.setst][0]);
  if(ds.take&&n){if(!me()){toast('Сначала выберите себя вверху в поле «Я»');return}return updNumber(n,{owner:me(),status:n.status==='new'?'work':n.status},'Номер ваш')}
  if(ds.tokc&&n)return updNumber(n,{owner:'kc',status:n.status==='new'?'work':n.status},'Передан колл-центру');
  if(t.id==='d-savenote'&&n)return updNumber(n,{note:$('#d-note').value.slice(0,2000)},'Заметка сохранена');
  if(ds.mkdeal&&n){const id=newId();const ok=await guard(()=>db.doc('deals/'+id).set({title:'Сделка '+n.phone,phone:n.phone,sum:0,stage:'new',owner:n.owner&&n.owner!=='kc'?n.owner:me(),next:'',nextDate:'',numRef:n.ref,createdAt:new Date().toISOString()}));if(ok){await updNumber(n,{deal:id,status:'lead'});openDrawer('deal',id);toast('Сделка создана')}return}
  if(ds.next){const d=S.deals.find(x=>x.id===ds.next);const i=STAGES.findIndex(s=>s.id===(d.stage||'new'));if(d&&i<4)return guard(()=>db.doc('deals/'+d.id).update({stage:STAGES[i+1].id}),'→ '+STAGES[i+1].n);return}
  if(ds.deldeal){if(t.dataset.confirm!=='1'){t.dataset.confirm='1';t.textContent='Точно удалить?';return}const ok=await guard(()=>db.doc('deals/'+ds.deldeal).delete(),'Сделка удалена');if(ok)closeDrawer();return}

/* stacked bars by day; series = [{name,color,key}] , rows = [{d, v:{key:n}, extra}] */
function stackChart(rows,series,opts={}){
  const narrow=innerWidth<760;const W=narrow?400:720,H=narrow?230:(opts.h||250),L=30,R=6,T=10,B=26;const n=rows.length;if(!n)return '<p class="mut">Нет данных за период</p>';
  const max=Math.max(1,...rows.map(r=>series.reduce((a,s)=>a+(r.v[s.key]||0),0)));
  const step=niceStep(max);const top=Math.ceil(max/step)*step;
  const bw=(W-L-R)/n,gap=Math.min(10,bw*.28),w=Math.max(3,bw-gap);
  const y=v=>T+(H-T-B)*(1-v/top);
  let g='';for(let v=0;v<=top;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-6}" y="${y(v)+4}" class="axis" text-anchor="end">${v}</text>`}
  const every=Math.ceil(n/(narrow?6:12));
  rows.forEach((r,i)=>{const x=L+i*bw+gap/2;let base=0;const parts=series.filter(s=>r.v[s.key]);
    parts.forEach((s,j)=>{const v=r.v[s.key];const y1=y(base+v),y0=y(base);const h=Math.max(0,y0-y1-(j<parts.length-1?0:0)-(j>0?2:0));
      g+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(h,1)}" rx="${j===parts.length-1?3:1}" fill="${s.color}"/>`;base+=v});
    const tot=series.reduce((a,s)=>a+(r.v[s.key]||0),0);
    const t=`<b>${esc(r.label||dShort(r.d))}</b>`+series.map(s=>r.v[s.key]?`<div><i class="mdot" style="background:${s.color}"></i>${esc(s.name)}: ${r.v[s.key]}</div>`:'').join('')+(r.extra||'')+(series.length>1?`<div class="tt">Всего: ${tot}</div>`:'');
    g+=`<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" class="hit"${tip(t)}/>`;
    if(i%every===0||i===n-1&&n<=12)g+=`<text x="${x+w/2}" y="${H-8}" class="axis" text-anchor="middle">${esc(r.short||dShort(r.d))}</text>`});
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" class="base"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'График')}">${g}</svg>`}
function niceStep(max){const raw=max/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,5,10])if(raw<=m*p)return m*p;return 10*p}
function legend(series){return `<div class="legend">${series.map(s=>`<span><i class="mdot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`}
function hbars(items,opts={}){const max=Math.max(1,...items.map(i=>i[1]));return `<div class="hbars">${items.map(([k,v,sub])=>`<div class="hb"${tip(`<b>${esc(k)}</b><div>${v}${opts.unit||''}${sub?' · '+esc(sub):''}</div>`)}><span class="hk">${esc(k)}</span><span class="hbar"><i style="width:${Math.max(2,v/max*100)}%"></i></span><span class="hv num">${v}${sub?`<small> ${esc(sub)}</small>`:''}</span></div>`).join('')||'<p class="mut">Нет потерь за период</p>'}</div>`}
function funnelHtml(steps){const max=steps[0][1]||1;return `<div class="tfunnel">${steps.map(([k,v,note],i)=>`<div class="tf"${tip(`<b>${esc(k)}</b><div>${v} · ${pct(v,max)} от первого шага</div>${note?`<div class="tt">${esc(note)}</div>`:''}`)}><div class="tfk"><span>${esc(k)}</span><b class="num">${fmt(v)}</b></div><div class="tfbar"><i style="width:${Math.max(1.5,v/max*100)}%"></i></div><div class="tfp">${i?pct(v,steps[i-1][1])+' от предыдущего':''}</div></div>`).join('')}</div>`}

function heatmap(list){
  const hours=[];for(let h=9;h<=19;h++)hours.push(h);
  const days=[1,2,3,4,5];const cnt={};let max=0;
  list.forEach(c=>{const d=new Date(c.t.slice(0,10)+'T12:00:00Z').getUTCDay();const h=+c.t.slice(11,13);if(!days.includes(d))days.push(d);const k=d+'-'+h;cnt[k]=(cnt[k]||0)+1;if(cnt[k]>max)max=cnt[k]});
  days.sort((a,b)=>((a+6)%7)-((b+6)%7));
  const lvl=v=>!v?0:Math.min(5,Math.ceil(v/max*5));
  return `<div class="heat" style="grid-template-columns:28px repeat(${hours.length},minmax(0,1fr))"><span></span>${hours.map(h=>`<span class="hh">${h}</span>`).join('')}
  ${days.map(d=>`<span class="hd">${WD[d]}</span>${hours.map(h=>{const v=cnt[d+'-'+h]||0;return `<span class="hc l${lvl(v)}"${tip(`<b>${WD[d]}, ${h}:00–${h+1}:00</b><div>${v} разговоров</div>`)}></span>`}).join('')}`).join('')}</div>
  <div class="heatlg"><span>меньше</span>${[1,2,3,4,5].map(l=>`<i class="hc l${l}"></i>`).join('')}<span>больше</span></div>`}

function dayRows(list){
  if(!list.length)return[];
  const ds=list.map(c=>c.t.slice(0,10)).sort();let d=ds[0];const end=ds[ds.length-1];const rows=[];
  while(d<=end){const wd=new Date(d+'T12:00:00Z').getUTCDay();const day=list.filter(c=>c.t.startsWith(d));
    if(day.length||(wd!==0&&wd!==6)){const v={};day.forEach(c=>v[c.m]=(v[c.m]||0)+1);const ok=day.filter(c=>c.r==='ok').length;
      rows.push({d,v,extra:day.length?`<div class="tt">С результатом: ${ok}</div>`:'',label:WD[wd]+', '+dShort(d)})}
    d=addDays(d,1)}
  return rows}

olga(){

const LBR=[['Уже купили или выбрали',/купил|заказал|доставил|выбрал|определил|решил|нашл|подобрал|уже есть|есть кухня|уже вс[её]/],
  ['Просят не звонить',/не звоните|уберите|достали|надоел/],
  ['Не клиент: фирма или служебный номер',/компани|монтаж|сотруднич|сам с |сам могу|предложить|номер для|не существует|технич|мтт|банк|мегафон|ваканс|агентств|агенств|риелтор|застройщ|сз |служба безоп|опрос/],
  ['Не интересовались',/не\s*(рассм|инт|интр|собира|оставл|запраш)|ошиблись|откуда|с чего вы|нет такого запроса|первый раз|никогда|не знаю/],

  ['Просто смотрели',/просто (смотр|зашл)/],
  ['Позже, не сейчас',/полгода|следующ|декабр|позже|потом/],
  ['Бросили трубку',/брос|сброс|не стал слушать|до свидания|прекратил/],
  ['Нужно другое: дешевле или другой товар',/дешев|дорог|шкаф|стол\b/]];
const LB_OTHER='Отказ без объяснения';
function lbReason(t){t=String(t||'').toLowerCase();const r=LBR.find(([k,re])=>re.test(t));return r?r[0]:LB_OTHER}
function lbSrc(p,tag){const seg=((p.match(/^(B\d+)/i)||[])[1]||'').toUpperCase();const ph=(p.match(/(\d{10,11})\D*$/)||[])[1]||'';
  return {seg,src:ph&&tag?tag:ph?ph:p.replace(/^B\d+_/i,'').trim()||'без проекта',ph}}
function lbAdd(lb,r,I,a){
  const base=ruDate(cell(r,I.base)).slice(0,10);const {seg,src,ph}=lbSrc(cell(r,I.p),cell(r,I.tag));const k=base+'|'+seg+'|'+src;
  const g=lb[k]||(lb[k]={b:base,seg,src,ph:[],n:0,called:0,reached:0,int:0,no:0,cb:0,dead:0,wait:0,sum:0,att:[0,0,0],rs:{}});
  g.n++;if(ph&&!g.ph.includes(ph))g.ph.push(ph);
  const s=a.filter(Boolean);if(!s.length)return;g.called++;g.sum+=num(cell(r,I.sum));
  const first=a.findIndex(x=>x&&!/^НДЗ/.test(x));if(first>=0){g.reached++;g.att[first]++}
  const last=s[s.length-1];
  if(a.includes('Заинтересованный'))g.int++;else if(last==='Неактуально'){g.no++;const why=lbReason(cell(r,I.cm));g.rs[why]=(g.rs[why]||0)+1}
  else if(last==='Перезвон')g.cb++;else if(last==='НДЗ 3')g.dead++;else g.wait++;
}

/* таблица «Прозвон лидов»: Ольга */
function findRow(rows,first){return rows.findIndex(r=>cell(r,0)===first)}
function parseSummary(rows){
  const tariff={first:0,repeat:0,interested:0};const ti=findRow(rows,'Вид звонка');
  if(ti>=0){tariff.first=num(cell(rows[ti+1]||[],1));tariff.repeat=num(cell(rows[ti+2]||[],1));tariff.interested=num(cell(rows[ti+3]||[],1))}
  const clients=[];const ci=findRow(rows,'Клиент (название листа)');
  if(ci>=0)for(let i=ci+1;i<rows.length;i++){const r=rows[i];const n=cell(r||[],0);if(!n)break;if(n==='ИТОГО')break;clients.push({name:n,first:num(r[1]),repeat:num(r[2]),interested:num(r[3]),sum:num(r[4])})}
  return {tariff,clients};
}
const projKey=p=>{p=String(p||'').trim();const seg=(p.match(/^(B\d+)/i)||[])[1]||'';const tail=(p.match(/(\S+)\s*$/)||[])[1]||'';const ph=(tail.match(/(\d+)\D*$/)||[])[1];return seg&&ph?`${seg.toUpperCase()} ${ph}`:p.replace(/_/g,' ')};
function parseClientSheet(name,rows){
  const h=rows[0]||[];const ix=n=>h.indexOf(n);
  const I={id:ix('id'),p:ix('Проект'),tag:ix('Тег проекта'),cm:ix('Комментарий'),c1:ix('Звонок 1 (первичный)'),c2:ix('Звонок 2 (повторный)'),c3:ix('Звонок 3 (повторный)'),sum:ix('Сумма'),base:ix('Дата базы'),d1:ix('Дата звонка 1'),d2:ix('Дата звонка 2'),d3:ix('Дата звонка 3')};
  const combos={},sources={},interested=[],lb={};let since='',notCalled=0;
  rows.slice(1).forEach(r=>{
    if(!/^\d+$/.test(cell(r,I.id)))return;
    const a=[cell(r,I.c1),cell(r,I.c2),cell(r,I.c3)];lbAdd(lb,r,I,a);if(!a.some(Boolean)){notCalled++;return}const k=a.join('|');combos[k]=(combos[k]||0)+1;
    const base=ruDate(cell(r,I.base));if(base&&(!since||base<since))since=base;
    const pk=projKey(cell(r,I.p));const s=sources[pk]||(sources[pk]=[pk,0,0]);s[1]++;s[2]+=num(cell(r,I.sum));
    const ii=a.indexOf('Заинтересованный');
    if(ii>=0){const day=ruDate(cell(r,[I.d1,I.d2,I.d3][ii]))||base;interested.push([Number(cell(r,I.id)),pk,base,day.slice(0,10),name])}
  });
  return {since,notCalled,lb:Object.values(lb),combos:Object.entries(combos).map(([k,n])=>[...k.split('|'),n]),sources:Object.values(sources).sort((a,b)=>a[0]<b[0]?-1:1),interested};
}
function parseDays(rows,width){return rows.slice(1).map(r=>{const d=ruDate(cell(r,0));if(!d)return null;return [d,...r.slice(1,width).map(num)]}).filter(Boolean).sort((a,b)=>a[0]<b[0]?-1:1)}
function parseOlgaBot(sum,days,calls){
  const all=sum.find(r=>cell(r,0)==='Всего')||[];
  const attempts={};const ai=findRow(sum,'Итог');
  if(ai>=0)for(let i=ai+1;i<sum.length;i++){const k=cell(sum[i]||[],0);if(!k||/^Лидов/.test(k))break;attempts[k]=num(sum[i][1])}
  const lr=sum.find(r=>/^Лидов/.test(cell(r,0)))||[];
  const up=(sum.find(r=>/^Обновлено ботом/.test(cell(r,0)))||[''])[0];
  const h=calls[0]||[];const ix=n=>h.indexOf(n);
  const I={ph:ix('Телефон'),p:ix('Проект'),rem:ix('Напоминание'),c1:ix('Звонок 1'),c2:ix('Звонок 2'),c3:ix('Звонок 3'),d1:ix('Дата звонка 1'),d2:ix('Дата звонка 2'),d3:ix('Дата звонка 3'),mat:ix('Материал'),when:ix('Удобное время')};
  const cbs=calls.slice(1).filter(r=>/^\+?\d{10,}/.test(cell(r,I.ph))).map(r=>{
    const a=[cell(r,I.c1),cell(r,I.c2),cell(r,I.c3)];if(!a.includes('Перезвон'))return null;
    const t=[I.d3,I.d2,I.d1].map(i=>ruDate(cell(r,i))).find(Boolean)||'';
    return [cell(r,I.ph),cell(r,I.p)?projKey(cell(r,I.p)):'',a[0],a[1],a[2],t,cell(r,I.when)||cell(r,I.rem),cell(r,I.mat)]}).filter(Boolean)
    .sort((a,b)=>a[5]<b[5]?1:-1);
  return {updated:ruDate(up),leads:num(lr[1]),first:num(all[1]),repeat:num(all[2]),sum:num(all[4]),attempts,
    days:parseDays(days,6).map(([d,f,r,t,i,s])=>[d,f,r,t,s]),callbacks:cbs};
}

async function fetchBot(){
  const [calls,cbs,all]=await Promise.all([gsRange(SHEET_BOT,'Звонки!A1:P1000'),gsRange(SHEET_BOT,'Перезвоны!A1:I1000'),
    gsRange(SHEET_BOT,"'Все звонки'!A1:J3000").catch(()=>null)]);
  return {...parseBotCalls(calls),callbacks:parseCallbacks(cbs),mango:all?parseMango(all):null};
}
async function fetchLeads(){
  const [sum,days,oSum,oDays,oCalls]=await Promise.all([gsRange(SHEET_LEADS,'Сводка!A1:F60'),gsRange(SHEET_LEADS,'По дням!A1:F400'),
    gsRange(SHEET_LEADS,"'Ольга · Сводка'!A1:E60"),gsRange(SHEET_LEADS,"'Ольга · По дням'!A1:F400"),gsRange(SHEET_LEADS,"'Ольга · Звонки'!A1:R2000")]);

  const clients=S.clients.map((c,i)=>({...c,since:sheets[i].since||'',combos:sheets[i].combos,notCalled:sheets[i].notCalled,lb:sheets[i].lb}));
  const KI=clients.findIndex(c=>/кухон/i.test(c.name));

    sources:KI>=0?sheets[KI].sources:[],interested:sheets.flatMap(s=>s.interested).sort((a,b)=>a[3]<b[3]?-1:1),
    bot:parseOlgaBot(oSum,oDays,oCalls)};
}

function applyLive(p){
  DATA.asof=p.at;DATA.calls=[...BASE_CALLS,...p.calls].sort((a,b)=>a.t<b.t?1:a.t>b.t?-1:0);DATA.callbacks=p.callbacks;DATA.missing=p.missing;
  if(p.olga&&p.olga.clients&&p.olga.clients.length)DATA.olga=p.olga;if(p.mango)DATA.mango=p.mango;
  recomputeDates();
}
async function liveRefresh(manual){
  if(!LIVE.mcp||LIVE.busy)return;LIVE.busy=true;if(LIVE.state!=='ok')LIVE.state='loading';if(manual)render();
  try{
    const [bot,leads]=await Promise.allSettled([withRetry(fetchBot),withRetry(fetchLeads)]);
    if(bot.status==='rejected'&&leads.status==='rejected')throw bot.reason;
    const at=mskNow();
    const p={at,calls:bot.status==='fulfilled'?bot.value.calls:DATA.calls.filter(c=>c.s==='b'),callbacks:bot.status==='fulfilled'?bot.value.callbacks:DATA.callbacks,
      missing:bot.status==='fulfilled'?bot.value.missing:(DATA.missing||0),mango:bot.status==='fulfilled'?bot.value.mango:(DATA.mango||null),olga:leads.status==='fulfilled'?leads.value:DATA.olga};
    applyLive(p);
    LIVE.state='ok';LIVE.src='live';LIVE.at=at;LIVE.err=(bot.status==='rejected'?bot.reason:leads.status==='rejected'?leads.reason:null);
    LIVE.partial=bot.status==='rejected'?'bot':leads.status==='rejected'?'leads':null;
    shareLive(p);
  }catch(e){LIVE.state='err';LIVE.err=e||{code:'upstream_error'}}
  LIVE.busy=false;if(TEAM_PAGES.has(current))render();
}

const phKey=p=>String(p||'').replace(/\D/g,'').slice(-10);
function autoStage(cs){let i=0;cs.forEach(c=>{if(c.r!=='ok')return;i=Math.max(i,c.g.includes('КП')||c.g.includes('встреча')?2:1)});return i}
function pipeClients(){
  const by={};
  DATA.calls.forEach(c=>{if(!c.r||!c.ph)return;const k=phKey(c.ph);if(k.length<10)return;(by[k]=by[k]||[]).push(c)});
  const cbs={};(DATA.callbacks||[]).forEach(c=>{if(/закрыт/.test(c.st))return;const k=phKey(c.ph);if(!cbs[k]||c.d<cbs[k].d)cbs[k]=c});
  return Object.entries(by).map(([k,cs])=>{
    cs.sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0);const last=cs[cs.length-1];const man=(S.pipe||{})[k]||null;
    const auto=autoStage(cs);let st=auto;const lost=!!man&&man.stage==='lost';
    if(man&&PIDX[man.stage]!=null)st=Math.max(auto,PIDX[man.stage]);
    const co=[...cs].reverse().map(c=>c.co).find(Boolean)||'';
    const g=[...new Set(cs.filter(c=>c.r==='ok').flatMap(c=>c.g))];
    return {k,ph:last.ph,co,m:last.m,first:cs[0].t,last:last.t,calls:cs,auto,st,lost,man,g,cb:cbs[k]||null,hot:cs.some(c=>c.r==='hot')};
  });
}
function pipeList(){return pipeClients().filter(c=>inPeriod(c.first,pipeF.per)&&(pipeF.m==='all'||c.m===pipeF.m))}
function fbP(key,val,name,extra=''){return `<button class="fbtn" data-pf="${key}:${val}" aria-pressed="${pipeF[key]===val}">${extra}${name}</button>`}

    <div class="r"><span class="meta">${c.g.length?esc(c.g.join(', ')):c.hot?'горячий, потерян':'разговор'} · ${dShort(c.last)}</span><span class="spacer"></span>${sum}</div>

    ${c.man&&c.man.note?`<div class="meta pnote">${esc(c.man.note)}</div>`:''}</div>`;

let leadF={c:'all'};
const LB_KEYS=['n','called','reached','int','no','cb','dead','wait','sum'];
function lbAgg(gs){const s={n:0,called:0,reached:0,int:0,no:0,cb:0,dead:0,wait:0,sum:0,att:[0,0,0],rs:{}};
  gs.forEach(g=>{LB_KEYS.forEach(k=>s[k]+=g[k]);g.att.forEach((v,i)=>s.att[i]+=v);for(const k in g.rs)s.rs[k]=(s.rs[k]||0)+g.rs[k]});
  s.noreq=s.rs['Не интересовались']||0;return s}
const rub=v=>v?fmt(Math.round(v))+' ₽':'—';
const perInt=s=>s.int?rub(s.sum/s.int):'—';

  const row=x=>`<td class="num">${fmt(x.s.called)}</td><td class="num">${fmt(x.s.reached)}</td><td class="nowrap">${bar(x.s.reached,x.s.called)}</td><td class="num">${x.s.att[0]}</td><td class="num">${x.s.dead}${x.s.wait?`<div class="meta">ждут попытки ${x.s.wait}</div>`:''}</td>`;

  return head+filt+`
  <div class="kpis">
    <div class="kpi"><small>Обзвонено лидов</small><div class="v">${fmt(s.called)}</div><div class="d mut">хотя бы один звонок</div></div>
    <div class="kpi"><small>Уровень дозвона</small><div class="v">${pct(s.reached,s.called)}</div><div class="d mut">${fmt(s.reached)} ответили хотя бы раз</div></div>
    <div class="kpi"><small>С первой попытки</small><div class="v">${pct(att[0],s.called)}</div><div class="d mut">${fmt(att[0])} из ${fmt(s.called)}</div></div>
    <div class="kpi"><small>Нет ответа за 3 попытки</small><div class="v">${fmt(s.dead)}</div><div class="d mut">${s.wait?'ещё ждут попытки '+s.wait:'все попытки сделаны'}</div></div>
  </div>
  <div class="grid2 even">
    <section class="panel"><h2>С какой попытки дозвонились</h2><p class="sub">${s.reached} ${plural(s.reached,'лид ответил','лида ответили','лидов ответили')} хотя бы раз</p>${hbars([['С первой',att[0],pct(att[0],s.reached)],['Со второй',att[1],pct(att[1],s.reached)],['С третьей',att[2],pct(att[2],s.reached)]])}
      <p class="sub" style="margin:10px 0 0">${late?`Повторные звонки подняли дозвон с ${pct(att[0],s.called)} до ${pct(s.reached,s.called)}.`:'Пока все дозвоны пришлись на первую попытку.'}</p></section>
    ${all?`<section class="panel"><h2>По клиентам</h2><p class="sub">Уровень дозвона по каждой базе клиента</p>${hbars(byC.map(x=>[x.k,Math.round(x.s.reached/Math.max(1,x.s.called)*100),x.s.reached+' из '+x.s.called]),{unit:'%'})}</section>`
      :`<section class="panel"><h2>${esc(leadF.c)}</h2><p class="sub">Дозвон по дням базы</p>${hbars(byB.map(x=>[x.l[0].b?dShort(x.l[0].b):'без даты',Math.round(x.s.reached/Math.max(1,x.s.called)*100),x.s.reached+' из '+x.s.called]),{unit:'%'})}</section>`}
  </div>
  ${tbl('По датам базы','Каждая выгрузка номеров отдельно',byB.map(x=>`<tr><td class="nowrap"><b>${x.l[0].b?dLong(x.l[0].b):'без даты'}</b>${all?`<div class="meta">${esc(cShort(x.l[0].cl))}</div>`:''}</td>${row(x)}</tr>`).join(''),'База от')}
  ${tbl('По источникам','Конкурент или его номер из названия проекта',bySrc.map(x=>`<tr><td><b class="nowrap">${srcName(x)}</b>${all?`<div class="meta">${esc(cShort(x.l[0].cl))}</div>`:''}${srcTip(x)}</td>${row(x)}</tr>`).join(''),'Источник')}
  ${tbl('По сегментам','Сегмент B1–B6 из названия проекта',bySeg.map(x=>`<tr><td><b>${esc(x.k)}</b></td>${row(x)}</tr>`).join(''),'Сегмент')}
  <p class="foot">Дозвон значит, что хотя бы один звонок закончился не «НДЗ»: «Неактуально», «Перезвон» или «Заинтересованный». Лиды без единого звонка в расчёт не входят.</p>`}
});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-lf]');if(b){leadF.c=b.dataset.lf;render()}});
/* ---------- вкладки менеджеров ---------- */
let mgrF={m:'',per:'7'};
function mgrCbRow(c){const late=c.st==='просрочен'||c.d<TODAY;return `<div class="cbrow ${late?'late':''}"><div class="cbd"><b>${dShort(c.d)}</b><span class="meta">${late?'просрочен':c.tm==='примерно'?'примерно':esc(c.tm)}</span></div><div class="cbm"><div class="nr1"><span class="st ${c.what==='Встреча'?'st-hot':'st-work'}">${esc(c.what)}</span>${c.co?`<span class="meta">${esc(c.co)}</span>`:''}</div>${c.txt?`<div class="cbq">«${esc(c.txt)}»</div>`:''}</div><a class="btn sm" href="${telHref(c.ph)}">${esc(fmtPhone(c.ph))}</a></div>`}
Object.assign(VIEWS,{
mgr(){
  const ms=MGR.filter(m=>DATA.calls.some(c=>c.m===m&&c.r));if(!ms.includes(mgrF.m))mgrF.m=ms[0]||'';const m=mgrF.m;
  const head=`<div class="head"><div><h1>Менеджеры</h1><p class="lead">Личная страница каждого менеджера: звонки из Манго, разговоры и их итоги, перезвоны и клиенты в воронке.</p>${liveNote()}</div></div>`;
  if(!m)return head+'<p class="mut">Пока нет менеджеров с разговорами</p>';
  const tabs=`<div class="filters mtabs">${ms.map(x=>`<button class="fbtn" data-mt="${esc(x)}" aria-pressed="${x===m}">${mdot(x)}${esc(x)}</button>`).join('')}</div>
    <div class="filters">${PERIODS.map(([k,n])=>`<button class="fbtn" data-mp="${k}" aria-pressed="${mgrF.per===k}">${n}</button>`).join('')}</div>`;
  const per=PERIODS.find(p=>p[0]===mgrF.per)[1];
  const list=DATA.calls.filter(c=>c.r&&c.m===m&&inPeriod(c.t,mgrF.per));const s=teamStats(list);
  const mr=DATA.mango?DATA.mango.rows.filter(r=>r[1]===m&&inPeriod(r[0],mgrF.per)):[];
  const T=mr.reduce((a,r)=>{a.o+=r[3];a.a+=r[4];a.t+=r[5];a.i+=r[6];a.mi+=r[7];a.mn+=r[8];if(r[3])a.d++;return a},{o:0,a:0,t:0,i:0,mi:0,mn:0,d:0});
  const cbs=(DATA.callbacks||[]).filter(c=>c.m===m&&!c.st.startsWith('закрыт')).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const late=cbs.filter(c=>c.st==='просрочен'||c.d<TODAY),today=cbs.filter(c=>c.d===TODAY&&!late.includes(c));
  const cl=pipeClients().filter(c=>c.m===m&&!c.lost);const inWork=cl.filter(c=>c.st>=1).sort((a,b)=>a.last<b.last?1:-1);
  const stc=PSTAGES.map((p,i)=>[p.n,cl.filter(c=>c.st===i).length]);
  const loss=topLoss(list);
  let chart;
  if(DATA.mango){const ds=[...new Set(mr.map(r=>r[0]))].sort();const rows=[];
    if(ds.length){let d=ds[0];while(d<=ds[ds.length-1]){const wd=new Date(d+'T12:00:00Z').getUTCDay();const r=mr.find(x=>x[0]===d);
      if(r||(wd!==0&&wd!==6))rows.push({d,v:r?{a:r[4],n:r[3]-r[4]}:{},label:WD[wd]+', '+dShort(d),extra:r?`<div class="tt">Разговоров от ${DATA.mango.min} с: ${r[5]} · на линии ${hm(r[8])}</div>`:''});d=addDays(d,1)}}
    const ser=[{name:'Дозвонились',color:'var(--s3)',key:'a'},{name:'Без ответа',color:'var(--surface-3,#c9ced4)',key:'n'}];
    chart=`<h2>Наборы по дням</h2><p class="sub">Все исходящие из Манго</p>${stackChart(rows,ser,{label:'Наборы по дням',h:220})}${legend(ser)}`}
  else{const ser=[{name:m,color:MCLR(m),key:m}];chart=`<h2>Разговоры по дням</h2><p class="sub">Разобранные ботом разговоры. Все наборы из Манго появятся после обновления бота</p>${stackChart(dayRows(list),ser,{label:'Разговоры по дням',h:220})}`}
  const recent=list.slice().sort((a,b)=>a.t<b.t?1:-1).slice(0,12);
  const what=c=>c.r==='ok'?esc(c.g.join(', ')||'результат'):esc(c.l||'');
  return head+tabs+`
  <div class="kpis k5">
    <div class="kpi"><small>Наборов</small><div class="v">${DATA.mango?fmt(T.o):'—'}</div><div class="d mut">${DATA.mango?(T.d?'≈ '+Math.round(T.o/T.d)+' в день':'нет за период'):'после обновления бота'}</div></div>
    <div class="kpi"><small>Дозвонились</small><div class="v">${DATA.mango?pct(T.a,T.o):'—'}</div><div class="d mut">${DATA.mango?fmt(T.a)+' · на линии '+hm(T.mn):'после обновления бота'}</div></div>
    <div class="kpi"><small>Разговоров разобрано</small><div class="v">${fmt(s.talks)}</div><div class="d mut">${per.toLowerCase()}</div></div>
    <div class="kpi"><small>С результатом</small><div class="v">${fmt(s.ok)}</div><div class="d">${pct(s.ok,s.talks)} · встреч ${s.meet}, КП ${s.kp}</div></div>
    <div class="kpi ${late.length?'hot':''}"><small>Перезвоны</small><div class="v">${late.length} · ${today.length}</div><div class="d mut">просрочено · на сегодня</div></div>
  </div>
  <div class="grid2 even">
    <section class="panel"><h2>Перезвоны <span class="meta">${cbs.length}</span></h2><p class="sub">Открытые договорённости, сначала самые ранние</p><div class="cblist">${cbs.slice(0,8).map(mgrCbRow).join('')||'<p class="mut">Открытых перезвонов нет</p>'}</div>${cbs.length>8?`<p class="meta">и ещё ${cbs.length-8} в разделе «Перезвоны»</p>`:''}</section>
    <section class="panel"><h2>Клиенты в воронке <span class="meta">${inWork.length}</span></h2><p class="sub">${stc.slice(1).map(([n,v])=>`${esc(n)}: <b>${v}</b>`).join(' · ')}</p><div class="mpcards">${inWork.slice(0,6).map(pcard).join('')||'<p class="mut">Пока нет клиентов дальше разговора</p>'}</div>${inWork.length>6?`<p class="meta">и ещё ${inWork.length-6} в разделе «Воронка продаж»</p>`:''}</section>
  </div>
  <div class="grid2 even">
    <section class="panel">${chart}</section>
    <section class="panel"><h2>Где теряет разговоры</h2><p class="sub">${per}. ${s.hot+s.lost} ${plural(s.hot+s.lost,'разговор','разговора','разговоров')} с шансом без результата</p>${hbars(loss)}</section>
  </div>
  <section class="panel"><h2>Последние разговоры</h2><p class="sub">Нажмите, чтобы открыть разбор</p><div class="mlist">${recent.map(c=>`<div class="ncard" data-call="${c.id}" tabindex="0"><div class="nmain"><div class="nr1"><span>${dLong(c.t)}</span>${resChip(c.r)}</div><div class="nr2"><span>${TYN[c.ty]||''}</span>${c.co?`<span class="what">${esc(c.co)}</span>`:''}</div><div class="nr3">${what(c)}</div></div><a class="callbtn" href="${telHref(c.ph)}" aria-label="Позвонить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></a></div>`).join('')||'<p class="mut">Нет разговоров за период</p>'}</div></section>`}
});
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-mt],[data-mp]');if(!t)return;if(t.dataset.mt)mgrF.m=t.dataset.mt;if(t.dataset.mp)mgrF.per=t.dataset.mp;render()});
/* tooltip */
(()=>{const tp=document.createElement('div');tp.id='tip';tp.setAttribute('role','tooltip');document.body.appendChild(tp);let cur=null;
const show=(el,x,y)=>{if(el!==cur){tp.innerHTML=el.getAttribute('data-tip');cur=el}tp.classList.add('show');const r=tp.getBoundingClientRect();let L=x+14,T=y+14;if(L+r.width>innerWidth-8)L=x-r.width-14;if(L<8)L=8;if(T+r.height>innerHeight-8)T=y-r.height-14;tp.style.left=L+'px';tp.style.top=T+'px'};
const hide=()=>{tp.classList.remove('show');cur=null};
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)show(el,e.clientX,e.clientY);else if(cur)hide()});
document.addEventListener('scroll',hide,true);})();
async function boot(){
  const saved=lsGet('avr-page','team');if(VIEWS[saved])current=saved;
  render();
  const c=window.claude;
  if(!c||!c.use){S.nodb=true;return render()}
  [db,user,dl]=await Promise.all([c.use('db'),c.use('user'),c.use('downloads')]);
  if(!db){S.nodb=true;liveBoot();return render()}
  if(user){myId=await user.id();const can=await user.can('data.write');if(can===false)S.readonly=true}
  liveBoot();pipeBoot();
  const fail=e=>{if(e&&(e.code==='revoked'))S.nodb=true;render()};
  let got=0;const done=()=>{if(++got>=4&&!S.ready){S.ready=true}render();if(current==='chat')paintNames()};
  db.doc('app/settings').onSnapshot(s=>{S.settings=s.exists?s.data():null;done()},fail);
  db.collection('batches').onSnapshot(q=>{S.batches=q.docs.map(d=>({id:d.id,...d.data()}));done()},fail);
  db.collection('sources').onSnapshot(q=>{S.sources=q.docs.map(d=>({id:d.id,...d.data()}));done()},fail);
  db.collection('deals').onSnapshot(q=>{S.deals=q.docs.map(d=>({id:d.id,...d.data()}));done()},fail);
  db.collection('chat').orderBy('ts','desc').limit(200).onSnapshot(q=>{S.chat=q.docs.map(d=>({id:d.id,...d.data()})).reverse();if(S.ready)done()},fail);
}
boot();
