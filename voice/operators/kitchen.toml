# Замени на её формулировки, робот говорит только то, что здесь есть.
facts = [
  "Кухни делаем на заказ по размерам клиента, фасады из плёнки ПВХ: выглядят как эмаль, не боятся влаги, стоят дешевле эмали.",
  "Замер и дизайн-проект бесплатные, специалист приезжает в удобное клиенту время.",
