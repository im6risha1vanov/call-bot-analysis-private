# Образец разговора: модель берёт из него тон и длину реплик. Составлен по звонкам Ольги и образцу Григория (21.10).
example = """
Клиент: Да, актуален.
Мария: Покупку в ближайшие пару месяцев планируете?
Клиент: Ну да, думаем.
Мария: Угу. Как к вам обращаться?
Клиент: Григорий.
Мария: Григорий, приятно. А кухня в каком городе будет стоять?
Клиент: В Сыктывкаре... э-э... под.
Мария: Под Сыктывкаром, верно?
Клиент: Да, в пригороде.
Мария: Хорошо. Замер и дизайн-проект у нас бесплатные, стоимость специалист считает уже по проекту. По фасадам что смотрите: плёнку, эмаль, пластик?
Клиент: Не знаю даже. А делаете долго?
Мария: Угу, сроки специалист скажет по вашему проекту, с учётом размеров. А по фасадам что ближе?
Клиент: Наверное, плёнку.
Мария: Хорошо, мы как раз с плёнкой работаем. На какой бюджет примерно ориентируетесь?
Клиент: Тысяч двести тридцать.
Мария: Смотрите, проекты у нас от двухсот пятидесяти. Такой бюджет рассматриваете?
Клиент: Ну, можно.
Мария: Хорошо. Когда удобно, чтобы специалист перезвонил?
Клиент: Завтра после обеда.
Мария: Григорий, тогда завтра после обеда специалист позвонит и договорится о бесплатном замере в пригороде. Договорились?
Клиент: Да.
Мария: Передаю специалисту, ждите звонка. Всего доброго.
"""

# Быстрые ответы: на ожидаемый простой ответ робот отвечает заготовкой сразу, без модели
# (быстрее и дешевле: модель зовём только на нестандартный ответ и на конец разговора).
# after — кусок вопроса робота (или список), answers — ответы клиента целиком,
# либо match / exclude — выражения по ответу (маленькими буквами, ё как е, без знаков);
# strip — что отрезать в начале («ну», «меня зовут»), max_words — сколько слов можно;
# unless — заготовку пропускаем, если робот уже задавал этот вопрос раньше (имя, город);
# reply — что сказать, {answer} в нём — слова клиента. Если не подошло, отвечает модель.
[[quick]]
after = "вопрос ещё актуален"
answers = ["да", "ага", "угу", "конечно", "да конечно", "актуален", "актуально", "да актуален", "да актуально",
           "вопрос актуален", "да вопрос актуален", "актуален вопрос", "да ещё актуален", "ещё актуален",
           "интересовался", "интересовалась", "да интересовался", "да интересовалась"]
reply = "Ага. А покупку планируете в ближайшие два месяца?"

[[quick]]
after = "ближайшие два месяца"
answers = ["да", "ага", "конечно", "да конечно", "планирую", "планируем", "да планирую", "да планируем"]
reply = "Угу. Как к вам обращаться?"

[[quick]]
after = ["каком городе", "каком районе"]
strip = '^((ну|это|город|у нас|мы|я|живу|живем) )+'
match = '^[а-я ]+$'
exclude = '\b(да|нет|не|ну|а|и|или|что|как|какой|какая|зачем|почему|сколько|цена|стоит|знаю|пока|потом|алло|подождите|секунду|занят|перезвоните|робот|кухня|кухню|пленк\w*|эмал\w*|пластик\w*|тысяч\w*|можно|хорошо|ладно|давайте|слушаю|сейчас|минут\w*|момент|секунд\w*|повтор\w*|слышно|понял\w*|спасибо|извините|нормально|квартир\w*|дом|доме|дач\w*|новостройк\w*)\b'
max_words = 3
reply = "{answer}, поняла. Замер и дизайн-проект у нас бесплатные, стоимость специалист считает уже по проекту. По фасадам что смотрите: плёнку, эмаль, пластик?"

