<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест голосового оператора</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2433; --muted:#6b7385; --line:#e3e6ec; --accent:#2f6fed; --robot:#eef3ff; --client:#f1f1f1; --ok:#1a8a4a; --bad:#c23b3b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --card:#1c2029; --text:#e6e9ef; --muted:#9aa3b5; --line:#2c3240; --accent:#6c9bff; --robot:#1f2a44; --client:#262a33; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:13px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:16px 0; }
  select, input, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { background:var(--bad); border-color:var(--bad); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  #log { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; min-height:260px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; }
  .robot { background:var(--robot); align-self:flex-start; }
  .client { background:var(--client); align-self:flex-end; }
  .msg small { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
  #interim { color:var(--muted); font-style:italic; align-self:flex-end; min-height:1em; }
  .sys { color:var(--muted); font-size:13px; text-align:center; }
  #result { margin-top:16px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; display:none; }
  #result table { border-collapse:collapse; width:100%; }
  #result td { padding:4px 8px 4px 0; border-top:1px solid var(--line); vertical-align:top; }
  #result td:first-child { color:var(--muted); width:40%; }
  fieldset { border:1px solid var(--line); border-radius:12px; padding:8px 12px; margin:0 0 12px; }
  legend { color:var(--muted); font-size:13px; padding:0 4px; }
  form { display:flex; gap:8px; margin-top:12px; }
  form input { flex:1; min-width:0; }
</style>
</head>
<body>
<main>
  <h1>Тест голосового оператора</h1>
  <div class="muted" id="status">Загрузка…</div>

  <div class="bar">
    <select id="operator"></select>
    <label><input type="checkbox" id="mic" checked> голосом</label>
    <button class="primary" id="call">Позвонить</button>
    <button class="danger" id="hangup" disabled>Положить трубку</button>
  </div>
  <fieldset id="voicebox">
    <legend>Голос</legend>
    <div class="bar" style="margin:4px 0">
      <select id="voice"></select>
      <select id="role"></select>
      <label>скорость <input type="range" id="speed" min="0.8" max="1.3" step="0.05" value="1"> <span id="speedv">1.0</span></label>
      <button id="listen" type="button">Прослушать</button>
    </div>
    <div class="muted" id="voicecfg"></div>
  </fieldset>
  <div class="muted">Говори в наушниках, иначе робот слышит сам себя. Можно и писать текстом внизу.</div>

  <div id="log" style="margin-top:12px"><div id="interim"></div></div>
  <form id="textform"><input id="text" placeholder="Ответ клиента текстом" autocomplete="off" disabled><button id="send" disabled>Отправить</button></form>

  <div id="result"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const OUTCOMES = { interested:'Заинтересованный', callback:'Перезвон', not_relevant:'Неактуально', ndz:'НДЗ', do_not_call:'Не звонить' };
const RATE = 16000;      // микрофон на сервер
let ttsRate = 48000;     // голос робота с сервера
let info = null;
let ws = null, ctx = null, micStream = null, worklet = null, playAt = 0, sources = [];

fetch('operators').then(r => r.json()).then(data => {
  info = data; ttsRate = info.tts_rate || ttsRate;
  for (const v of Object.keys(info.voices || {})) { const o = document.createElement('option'); o.value = o.textContent = v; $('voice').appendChild(o); }
  for (const op of info.operators) {
    const o = document.createElement('option');
    o.value = op.id; o.textContent = op.error ? `${op.id}: ошибка анкеты` : `${op.name}, ${op.company}`; o.disabled = !!op.error;
    $('operator').appendChild(o);
  }
  if (!info.asr) { $('mic').checked = false; $('mic').disabled = true; }
  pickOperatorVoice();
  $('status').textContent = `Распознавание: ${info.asr ? 'есть' : 'нет ключа Deepgram, только текст'}. Синтез: ${info.tts ? 'есть' : 'нет ключа Яндекса, робот отвечает текстом'}. Модель: ${info.llm}.`;
}).catch(e => $('status').textContent = 'Сервер не отвечает: ' + e);

const ROLES = { neutral:'нейтрально', good:'доброжелательно', friendly:'дружелюбно', strict:'строго', evil:'раздражённо', whisper:'шёпотом' };
function fillRoles(selected) {
  $('role').innerHTML = '';
  $('role').style.display = (info.voices[$('voice').value] || []).length ? '' : 'none';
  for (const r of (info.voices[$('voice').value] || [])) { const o = document.createElement('option'); o.value = r; o.textContent = ROLES[r] || r; o.selected = r === selected; $('role').appendChild(o); }
  showVoiceCfg();
}
function pickOperatorVoice() {
  const op = info.operators.find(o => o.id === $('operator').value) || {};
  if (op.voice) $('voice').value = op.voice;
  $('speed').value = op.voice_speed || 1; $('speedv').textContent = Number($('speed').value).toFixed(2);
  fillRoles(op.voice_role);
}
function voiceSettings() { return { voice: $('voice').value, role: $('role').value, speed: Number($('speed').value) }; }
function showVoiceCfg() {
  const v = voiceSettings();
  $('voicecfg').textContent = `Для анкеты: voice = "${v.voice}", voice_role = "${v.role}", voice_speed = ${v.speed}`;
}
$('operator').onchange = pickOperatorVoice;
$('voice').onchange = () => fillRoles();
$('role').onchange = showVoiceCfg;
$('speed').oninput = () => { $('speedv').textContent = Number($('speed').value).toFixed(2); showVoiceCfg(); };
$('listen').onclick = async () => {
  ctx = ctx || new AudioContext(); await ctx.resume();
  const op = info.operators.find(o => o.id === $('operator').value) || {};
  $('listen').disabled = true;
  try {
    const r = await fetch('preview', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...voiceSettings(), text: op.greeting || 'Здравствуйте! Подскажите, вопрос ещё актуален?' }) });
    if (!r.ok) { const e = await r.json().catch(() => ({})); sys('Голос: ' + (e.error || r.status)); return; }
    stopPlayback(); play(await r.arrayBuffer());
  } finally { $('listen').disabled = false; }
};

function add(role, text, note) {
  const d = document.createElement('div');
  d.className = 'msg ' + role; d.textContent = text;
  if (note) { const s = document.createElement('small'); s.textContent = note; d.appendChild(s); }
  $('log').insertBefore(d, $('interim'));
  d.scrollIntoView({ block: 'nearest' });
}
function sys(text) { const d = document.createElement('div'); d.className = 'sys'; d.textContent = text; $('log').insertBefore(d, $('interim')); }

function play(buf) {
  const pcm = new Int16Array(buf);
  const audio = ctx.createBuffer(1, pcm.length, ttsRate);
  const ch = audio.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  const src = ctx.createBufferSource();
  src.buffer = audio; src.connect(ctx.destination);
  playAt = Math.max(playAt, ctx.currentTime + 0.03);
  src.start(playAt); playAt += audio.duration;
  sources.push(src); src.onended = () => { sources = sources.filter(s => s !== src); };
}
function stopPlayback() { for (const s of sources) { try { s.stop(); } catch (e) {} } sources = []; playAt = 0; }

const WORKLET = `
class Down extends AudioWorkletProcessor {
  constructor(o) { super(); this.ratio = sampleRate / ${RATE}; this.pos = 0; this.out = []; }
  process(inputs) {
    const x = inputs[0][0]; if (!x) return true;
    for (; this.pos < x.length; this.pos += this.ratio) {
      const v = Math.max(-1, Math.min(1, x[Math.floor(this.pos)]));
      this.out.push(v < 0 ? v * 32768 : v * 32767);
    }
    this.pos -= x.length;
    if (this.out.length >= ${RATE / 25}) { this.port.postMessage(Int16Array.from(this.out).buffer); this.out = []; }
    return true;
  }
}
registerProcessor('down', Down);`;

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
  await ctx.audioWorklet.addModule(url);
  worklet = new AudioWorkletNode(ctx, 'down');
  worklet.port.onmessage = e => { if (ws && ws.readyState === 1) ws.send(e.data); };
  ctx.createMediaStreamSource(micStream).connect(worklet);
}

function cleanup() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (worklet) worklet.disconnect();
  micStream = worklet = null;
  $('call').disabled = false; $('hangup').disabled = true; $('text').disabled = $('send').disabled = true;
  $('interim').textContent = '';
}

$('call').onclick = async () => {
  $('result').style.display = 'none';
  for (const n of [...$('log').children]) if (n.id !== 'interim') n.remove();
  ctx = ctx || new AudioContext();
  await ctx.resume();
  const mic = $('mic').checked;
  if (mic) {
    try { await startMic(); } catch (e) { sys('Нет доступа к микрофону: ' + e.message); return; }
  }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}${location.pathname.replace(/[^/]*$/, '')}ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => ws.send(JSON.stringify({ type: 'start', operator: $('operator').value, mic, ...voiceSettings() }));
  ws.onmessage = e => {
    if (typeof e.data !== 'string') { play(e.data); return; }
    const m = JSON.parse(e.data);
    if (m.type === 'ready') { ttsRate = m.tts_rate || ttsRate; sys(`Звонок начат: ${m.operator}${m.mic ? ', говорите' : ', пишите ответы текстом'}`); $('call').disabled = true; $('hangup').disabled = false; $('text').disabled = $('send').disabled = false; $('text').focus(); }
    else if (m.type === 'transcript') { $('interim').textContent = ''; add(m.role, m.text, m.first_text_ms ? `первые слова через ${m.first_text_ms} мс` : ''); }
    else if (m.type === 'interim') $('interim').textContent = m.text + '…';
    else if (m.type === 'clear') { stopPlayback(); sys('перебили робота'); }
    else if (m.type === 'error') sys('Ошибка: ' + m.text);
    else if (m.type === 'result') showResult(m);
  };
  ws.onclose = () => { cleanup(); sys('Звонок завершён'); };
};

$('hangup').onclick = () => { stopPlayback(); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'hangup' })); };
$('textform').onsubmit = e => {
  e.preventDefault();
  const t = $('text').value.trim(); if (!t || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'text', text: t })); $('text').value = '';
};

function showResult(m) {
  const rows = [['Итог', (OUTCOMES[m.outcome] || m.outcome) + (m.transfer ? ' (перевод на специалиста)' : '')], ['Комментарий', m.comment],
    ...Object.entries(m.facts || {}).map(([k, v]) => [(m.labels || {})[k] || k, v]), ['Длительность', m.duration_s + ' с'], ['Стоимость модели', m.cost + ' ' + m.cost_unit]];
  const t = document.createElement('table');
  for (const [k, v] of rows) { const tr = t.insertRow(); tr.insertCell().textContent = k; tr.insertCell().textContent = v; }
  $('result').innerHTML = '<b>Итог звонка</b>'; $('result').appendChild(t); $('result').style.display = 'block';
}
</script>
</body>
</html>
